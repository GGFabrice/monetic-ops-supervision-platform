services:
  postgres:
    image: postgres:16
    container_name: monetic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: monetic_dw
      POSTGRES_USER: monetic_user
      POSTGRES_PASSWORD: monetic_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: